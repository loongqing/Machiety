[project]
name = "machiety"
version = "0.1.0"
description = "Machiety - LLM 驱动的命令行虚拟国家模拟游戏"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "aiohttp>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "aioresponses>=0.7"]

[project.scripts]
machiety = "machiety.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["machiety*"]

[tool.setuptools.package-data]
machiety = ["ui/*.tcss"]